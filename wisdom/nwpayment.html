<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Planet - Order Confirmation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #222;
    }

    .app-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #27ae60;
      color: white;
      position: fixed;
      height: 100vh;
      padding: 1.5rem 0;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 0 1.5rem 1.5rem;
      font-size: 1.6rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .nav-list {
      list-style: none;
      margin-top: 2rem;
    }

    .nav-item {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }

    .nav-item:hover,
    .nav-item.active {
      background: rgba(0,0,0,0.15);
    }

    .user-section {
      position: absolute;
      bottom: 2rem;
      left: 1.5rem;
      right: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 1.5rem;
    }

    .logout {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      flex: 1;
      padding: 1.5rem 2rem;
      transition: margin-left 0.3s;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    .menu-toggle {
      display: none;
      font-size: 1.8rem;
      color: #27ae60;
      cursor: pointer;
    }

    .back-arrow {
      font-size: 1.5rem;
      color: #27ae60;
      cursor: pointer;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .user-info {
      margin-left: auto;
      font-size: 1.2rem;
      color: #555;
    }

    .confirmation-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 1.8rem;
      max-width: 600px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.8rem;
      color: #444;
    }

    .payment-method {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .payment-method.selected {
      border-color: #001f3f;
      background: #001f3f;
      color: white;
    }

    .card-icon {
      font-size: 1.8rem;
      color:#219653
    }

    .card-details {
      flex: 1;
    }

    .card-type {
      font-weight: 600;
    }

    .card-number {
      color: #666;
      font-size: 0.95rem;
    }

    .radio {
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      
    }

    .radio.selected {
      border-color: #27ae60;
      background:white;
      background-color: white;
    }

    .address-block {
      padding: 1rem;
      background: #f9f9f9;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .address-icon {
      color: #27ae60;
      margin-right: 0.6rem;
    }

    .edit-icon {
      color: #27ae60;
      cursor: pointer;
      margin-left: auto;
    }

    .delivery-time {
      color: #555;
      font-size: 0.95rem;
    }

    .total-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #27ae60;
      text-align: center;
      margin: 1.5rem 0;
    }

    .place-order-btn {
      background: #27ae60;
      color: white;
      border: none;
      width: 100%;
      padding: 1.2rem;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
    }

    .place-order-btn:hover {
      background: #219653;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        padding: 1rem;
      }

      .menu-toggle {
        display: block;
      }

      .confirmation-card {
        padding: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }

      .payment-method {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-utensils"></i> FOOD PLANET
    </div>

    <ul class="nav-list">
      <li class="nav-item"><i class="fas fa-home"></i> Home</li>
      <li class="nav-item"><i class="fas fa-shopping-bag"></i> Mr Orders</li>
      <li class="nav-item"><i class="fas fa-user"></i> Profile</li>
    </ul>

    <div class="user-section">
      <div>@Lateef Lateef</div>
      <a href="#" class="logout">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header>
      <div class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </div>
      <div class="back-arrow"><i class="fas fa-arrow-left"></i></div>
      <h1>Order Confirmation</h1>
      <div class="user-info"><i class="fas fa-bell"></i></div>
    </header>

    <div class="confirmation-card">

      <div class="section-title">Payment Method</div>

      <div class="payment-method selected">
        <div class="radio selected"></div>
        <i class="fab fa-cc-mastercard card-icon"></i>
        <div class="card-details">
          <div class="card-type">Credit Card</div>
          <div class="card-number">**** **** **** 3302</div>
        </div>
      </div>

      <div class="payment-method">
        <div class="radio"></div>
        <i class="fab fa-cc-visa card-icon"></i>
        <div class="card-details">
          <div class="card-type">Debit Card</div>
          <div class="card-number">**** **** **** 1906</div>
        </div>
      </div>

      <div class="section-title">Delivery Address</div>

      <div class="address-block">
        <div style="display: flex; align-items: center; gap: 0.8rem;">
          <i class="fas fa-map-marker-alt address-icon"></i>
          <div>
            <strong>Lagos, Nigeria</strong><br>
            Koszykowa 82A, Lagos
          </div>
          <i class="fas fa-pencil-alt edit-icon"></i>
        </div>
        <div class="delivery-time" style="margin-top: 0.8rem;">
          Estimated delivery time: <strong>20-30 min</strong>
        </div>
      </div>

      <!-- <div class="total-price">
        Total Price: ₦8,900
      </div> -->

      <button class="place-order-btn">Place Order</button>

    </div>

  </main>

</div>

<script>
  // Mobile sidebar toggle
  const menuToggle = document.getElementById('menu-toggle');
  const sidebar = document.getElementById('sidebar');

  if (menuToggle && sidebar) {
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });
  }

  // Simple payment selection (demo)
  document.querySelectorAll('.payment-method').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.payment-method').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      document.querySelectorAll('.radio').forEach(r => r.classList.remove('selected'));
      item.querySelector('.radio').classList.add('selected');
    });
  });
</script>

</body>
</html>
