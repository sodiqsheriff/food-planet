<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="media.css">
    <title>Food Planet</title>
    <style>
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
        
            /* justify-content:center; */
            /* align-items: center;  */
            width: 100%;
            max-height: screen;
            overflow: hidden;
            /* background-color: rgba(128, 128, 128, 0.226); */
            /* margin: 2em; */
        }
        .topbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5em 0.5em 0 0.5em;
            border-bottom: 1px solid grey;
            /* background-color: #1b1b1b; */
        }
        .pht img{
            width: 100px;
            margin-left: 30px;
            margin-bottom: 10px;
        }
        .navlinks a{
            text-decoration: none;
            color: #000;
            margin: 0 17px;
            font-weight: 700;
            font-size: 18px;
        }
        .navlinks{
            display: flex;
            gap: 1em;
            align-items: center;
            text-transform: capitalize;
            margin-left: 90px;
        }
        .button{
            display: flex;
            align-items: center;
            margin-right: 30px;
        }
        .get{
            background-color: green;
            color: #fff;
            padding: 10px 30px;
            border-radius: 5px;
            margin-right: 15px;
            cursor: pointer;
            font-weight: 500;
        }
        .get a{
            text-decoration: none;
            color: #fff;
        }
        .log{
            color: green;
            border: 1px solid green;
            text-transform: capitalize;
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        .log a{
            text-decoration: none;
            color: #000;
        }
        .fast{
            display: flex;
            flex-direction: column;
            /* gap: 1em; */
            width: 50%;
            padding: 1em 5em 5em 2em;
            /* background-color: red; */
            margin: 110px;
            margin-top: 90px;
            /* margin-left: 400px; */
        }
        
        .food h1{
            display: inline-block;
            font-size: 70px;
            text-transform: capitalize;
            font-weight: 900;
            color: green;
            /* filter: drop-shadow(5px 5px 20px blue); */
        }
        h2{
            display: inline-block;
            font-size: 30px;
            font-weight: 900;
            /* width: 10px; */
            text-transform: capitalize;
            /* color: green; */
            /* filter: drop-shadow(5px 5px 20px blue); */
        }
        .fast p{
            font-weight: 700;
            font-size: 23px;
            /* color: grey; */
        }
        .fast h6{
            font-weight: 500;
            font-size: 15px;
            margin-top: 10px;
            color: grey;
        }
        .fast img{
            margin-top: 20px;
        }
        .fast button{
            /* width: 280px; */
            margin-top: 30px;
            background-color: rgb(11, 80, 11);
            color: #fff;
            padding: 10px 0;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 19px;
            text-transform: capitalize;
        }
        .fast button a{
            color: #fff;
            text-decoration: none;
        }
        .register{
            margin-top: 10px;
            font-size: 15px;
            color: grey;
            /* text-align: center; */
        }
        .register a{
            text-decoration: none;
            color: red;
            font-weight: 600;
        }
        .logo img{
            position: absolute;
            top: 20%;
            right: 0;
            left: 750px;
            width: 50%;
            height: 80%;
        }
       @media(max-width:768px){
        body{
            overflow: scroll;
            width: 50%;
            /* background-color: red; */
        }
         .topbar{
            display: none;
         }
            .fast{
                width: 100%;
                /* margin-right: 5em; */
                padding: 1em 2em 5em 2em;
                position: absolute;
                align-items: center;
                top: 47%;
                /* left: 0; */
                right: -28%;
                /* background-color: aqua; */
            }
            .fast p{
                width: 100%;
                font-size: 40px;
                font-weight: bold;
                /* color: blue; */
                /* text-align: center; */
            }
            .del{
                text-align: center;
                font-size: 25px;
                font-weight: 900;
            }
            .fast h6{
                width: 100%;
                height: 50%;
                text-align: center;
                font-size: 20px;
                font-weight: 500;
            }
            .logo img{
                position: static;
                width: 100%;
                height: 50%;
                top: 50%;
            }
            .logo{
                position: absolute;
                /* left: 20%; */
                /* top: 20%; */
                margin-top: 45px;
                width: 100%;
                /* background-color: yellow; */
                
            }
            .fast button {
                width: 300px;
                padding: 10px 0;
                font-size: 20px;
            
                margin-left: 2em;
            }
            
       }

    </style>
</head>
<body>
   <!-- topbar -->
    <div class="topbar">
        <div class="pht">
            <img src="./public/images/logo2.svg" alt="Food Planet Logo">
        </div>
        <div class="navlinks">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">contact</a>
            <a href="#">shop</a>
    </div>
         <div class="button">
            <div class="get"><a href="/hammed/signup.html">get Started</a></div>
            <div class="log"><a href="/hammed/login.html">log in</a></div>
         </div>
    </div>
    <div class="fast">
        <div class="food">
            <img src="./public/images/fast.svg" alt="">
        </div>
         <p class="del">delicious food at your fingertips</p>
         <h6>order your favorite meals from local restaurants.</h6>
         <img src="./public/images/star.svg" alt="" width="200">
         <button class="get"> <a href="/hammed/signup.html">order food</a></button>
         <div class="register">
            Already have an account? <a href="/hammed/login.html">login</a>
         </div>
    </div>
    <div class="logo">
    <img src="./public/images/food.svg" alt="">
    </div>
</body>
</html>
