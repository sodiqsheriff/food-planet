<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>food Planet</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        .image{
            width: 100%;
            height: auto;
        }
        body{
            background-color: rgba(128, 128, 128, 0.301);
            overflow: hidden;
            max-height: screen;
            /* width: 100%; */
            display: flex;
        }
        .logo2 img{
            margin-bottom: 1em;
            /* margin-left: 1em; */
            width: 150px;
            display: flex;
            justify-content: center;
            position: relative;
            left: 40%;
            top: 1%;
            
        }
        .container{
            width: 200%;
            display: flex;
            flex-direction: column;
            /* align-items: center; */
            background-color: white;
            padding: 1em 5em 5em 2em;
        }
        .main{
            display: flex;
            flex-direction: column;
            /* background-color: red; */
            /* align-items: center; */
            /* justify-content: center; */
            gap: 1.5em;
            
        }
        .input-field{
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        .input-field input{
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: 1px solid grey;
            border-radius: 10px;
        }
        button[type="submit"]{
            width: 70%;
            margin-top: 2em;
            margin-left: 8em;
            margin-right: 5em;
            padding: 1em 5em 1em 5em;
            border-radius: .5em;
            /* border: none; */
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        button a{
            text-decoration: none;
            color: white;
        }
         @media(max-width: 768px){
            .image{
                display: none;
            }
            .logo2{
                display: none;
            }
            .container{
                width: 80%;
                height: 100vh;
                /* overflow: hidden; */
            }
            .main{
                margin-top: 2em;
            }
            p{
                font-size: 20px;
            }
            button[type="submit"]{
                margin-right: 5em;
            }
         }
    </style>
</head>
<body>
    <div class="image">
        <img src="/public/images/wallpaper.svg" alt="">
    </div>
    <div class="container">
        <div class="logo2">
            <img src="/public/images/logo2.svg" alt="">
        </div>
        <div class="main">
            <h2>confirm your email</h2>
            <p> enter confirmation code:</p>
            <div class="input-field">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
            </div>
            <div class="button">
                <button type="submit"><a href="#">Verify</a></button>
            </div>
    </div>
</body>
</html>
