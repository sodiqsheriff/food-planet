<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>food Planet</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgba(128, 128, 128, 0.301);
            overflow-y: hidden;
            max-height: screen;
            width: 100%;
            display: flex;
        }
        
        .image{
            width: 100%;
            height: auto;
        }
        .logo2 img{
            margin-bottom: 1em;
            /* margin-left: 1em; */
            width: 150px;
            display: flex;
            justify-content: center;
            position: relative;
            left: 40%;
            top: 1%;
            
        }
        .container{
            width: 200%;
            display: flex;
            flex-direction: column;
            /* align-items: center; */
            background-color: white;
            padding: 1em 5em 5em 2em;
        }
        .main{
            display: flex;
            flex-direction: column;
            /* background-color: red; */
            /* align-items: center; */
            /* justify-content: center; */
            gap: 1.2em;
            
        }
         .google{
            padding: 0.5em 3em 0.5em 3em;
            /* margin: 0 1em 0 1em; */
            border-radius: 2em;
            border: 2px solid black;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            text-transform: capitalize;
            /* background-color: green; */
            background: transparent;
        }
        .google a{
            color: black;
            text-decoration: none;
        }
        .facebook{
            padding: 0.5em 3em 0.5em 3em;
            /* margin: 0 1em 0 1em; */
            border-radius: 2em;
            font-size: 16px;
            font-weight: 600;
            text-transform: capitalize;
            cursor: pointer;
            /* background: transparent; */
            background-color: green;
        }
        .input-field{
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }
        .input-field input{
            width: 70%;
            padding: 1em;
            margin-left: 7em;
            border-radius: 0.5em;
            border: 1px solid grey;
            /* font-size: 16px; */
        }

        .button{
            display: flex;
            /* gap: 1em; */
            justify-content: center;
        }
        .facebook a{
            color: white;
            text-decoration: none;
        }
        button[type="submit"]{
            width: 70%;
            margin-top: 1em;
            margin-left: 5em;
            margin-right: 5em;
            padding: 1em 5em 1em 5em;
            border-radius: .5em;
            /* border: none; */
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        button a{
            color: white;
            text-decoration: none;
        }
        .logo{
              width: 70%;
              margin-left: 15%;
              /* background-color: red; */
              border-top: 1px solid grey;
              padding-top: 1em;
                display: flex;
                justify-content: center;
        }
        .register{
            /* margin-top: 1em; */
            padding-bottom: 1em;
            display: flex;
            display: none;
            justify-content: center;
            /* background-color: red; */
            border-bottom: 1px solid grey;
        }
        .register a{
            text-decoration: none;
            color: red;
        }
       @media(max-width: 768px){
             body{
            overflow-y: scroll;
            width: 100%;
            /* height: 100%; */
             }
            .image{
                display: none;
            }
            .logo2{
                display: none;
            }
            .google{
                display: none;

            }
            .facebook{
                display: none;
            }
            .logo{
                display: none;
            }
            .container{
                width: 100%;
                height: 100vh;
                padding: 1em 1em 5em 1em;
            }
            .main{
                width: 100%;
                padding-top: 2em;
                /* margin-top: 2em; */
                /* background-color: black; */
                /* margin-left: 2em; */
            }
            .input-field input{
                width: 100%;
                margin-left: 0;
            }
            input::placeholder{
                font-size: 20px;
                text-transform: capitalize;
            }
            button[type="submit"]{
                /* margin-top: 0; */
               margin-right: 0;
                margin-left: 0;
                width:100%;
                padding: 1em 3em 1em 3em;
            }
            button[type="submit"] a{
                font-size: 25px;
            }
            .register{
            padding-bottom: 1em;
            padding-left: 2em;
            display: flex;
            display: block;
            font-size: 20px;
            justify-content: center;
            /* background-color: red; */
            border-bottom: 1px solid grey;
            }
         }

        
    </style>
</head>
<body>
    <div class="image">
            <img src="../public/images/wallpaper.svg" alt="">
    </div>
    <div class="container">
        <div class="logo2">
            <img src="../public/images/logo2.svg" alt="">
        </div>
        <div class="main">
            <div class="button">
                <button class="google"><a href="/hammed/login.html">login</a></button>
                <button class="facebook"><a href="#">sign up</a></button>
            </div>
            <div class="input-field">
                <input type="text" placeholder="full name">
            </div>
            <div class="input-field">
                <input type="text" placeholder="email address">
            </div>
            <div class="input-field">
                <input type="password" placeholder=" password">
            </div>
            <div class="input-field">
                <input type="password" placeholder="re-enter password">
            </div>
            <div class="button">
                <button type="submit"><a href="#">create account</a></button>
            </div>
            <div class="logo">
                <img src="/public/images/icon.svg" alt="">
            </div>
            <div class="register">
                <p>already have an account? <a href="">login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
