<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodHunt Verification</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <!-- Left Section -->
      <div class="auth-left">
        <img src="images/food.png" alt="Food Image" class="auth-image" />
        <img src="images/leaf.png" class="leaf leaf-1" />
        <img src="images/leaf.png" class="leaf leaf-2" />
      </div>

      <!-- Right Section -->
      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-logo">
            <img src="images/logo.png" alt="FoodHunt Logo" />
          </div>

          <h2>Verification Code</h2>
          <p>Enter your verification code</p>

          <div class="code-inputs">
            <input type="text" maxlength="1" />
            <input type="text" maxlength="1" />
            <input type="text" maxlength="1" />
            <input type="text" maxlength="1" />
          </div>

          <button
            class="auth-btn"
            onclick="window.location.href = 'index.html'"
          >
            Verify
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
