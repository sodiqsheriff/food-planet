<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Burger Joint - Food Planet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    /* Sidebar - same as before */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background-color: #043204;
      color: white;
      padding: 1rem 0;
      z-index: 100;
    }

    .sidebar-header {
      padding: 1.4rem 1.5rem;
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffca28;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar nav {
      margin-top: 2rem;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      color: white;
      text-decoration: none;
      font-size: 1.05rem;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #2e5c52;
    }

    .sidebar a i {
      margin-right: 12px;
      width: 24px;
      text-align: center;
    }

    .sidebar .logout {
      margin-top: auto;
      color: #ff6b6b;
    }

    /* Main Content */
    .main-content {
      margin-left: 240px;
      padding: 1.5rem 2rem;
      min-height: 100vh;
    }

    /* Header / User info */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }

    .notification {
      font-size: 1.4rem;
      color: #555;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent 60%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.8rem;
    }

    .restaurant-title {
      font-size: 2.1rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }

    .restaurant-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
    }

    .stars {
      color: #ffc107;
    }

    .price-range {
      font-weight: 600;
    }

    .cuisine {
      color: #ddd;
    }

    /* Categories */
    .categories {
      display: flex;
      gap: 12px;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-btn.active {
      background-color: #1a3c34;
      color: white;
      font-weight: 600;
    }

    .category-btn:not(.active) {
      background-color: #e9ecef;
      color: #555;
    }

    /* Menu Items */
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      
    }

    .menu-item {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      display: flex;
      transition: transform 0.2s;
    }

    .menu-item:hover {
      transform: translateY(-4px);
    }

    .menu-item img {
      width: 140px;
      height: 140px;
      object-fit: cover;
    }

    .menu-details {
      flex: 1;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .menu-name {
      font-size: 1.25rem;
      margin-bottom: 0.4rem;
      color: #1a3c34;
    }

    .menu-desc {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }

    .menu-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-size: 1.15rem;
      font-weight: bold;
      color: #d32f2f;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: white;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .qty-value {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
    }

    .add-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .hero-top{
      margin: 10px;
      
    }
    .pad{
      padding-left: 1rem;
      padding-right: 1rem;
      border-top: 1.5px 0 1.5px 0;
    }
    input[type="text"]{
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 0.5rem;
      border: 1px solid 4px;
      font-size: 14px;
      
    }

    @media (max-width: 992px) {
      .sidebar { width: 220px; }
      .main-content { margin-left: 220px; }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .main-content {
        margin-left: 0;
      }
      .menu-container {
        grid-template-columns: 1fr;
      }
      .menu-item {
        flex-direction: column;
      }
      .menu-item img {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="logo.svg" alt="foodlogo">
      <i class=""></i>
    
    </div>
    <nav>
      <a href="#" class="active"><img src="homeicon.svg"></i> Home</a>
      <a href="#"><img src="ordericon.svg"></i> My Orders</a>
      <a href="#"><img src="profilicon.svg"></i> Profile</a>
      <a href="#"><img src="logout.svg"><i class=""></i> Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header>
      <div class="user-info">
        <img src="belll.svg"></i>
        <img src="lateef.svg" alt="profile picture">
        <span>Lateef Lateef</span>
      </div>
    </header>
    <section class="hero-top">
     <h1>Find Your Favorite Food</h1>
     <div class="pad">
      <input type="text" placeholder="Search Resturant">
     </div>
    </section>

    <!-- Hero Banner -->
    <div class="hero">
      <img src="image5.jpg" alt="Double Cheeseburger">
      <div class="hero-overlay">
        <h1 class="restaurant-title">The Burger Joint</h1>
        <div class="restaurant-info">
          <span class="stars">★★★★★</span>
          <span class="cuisine">American • Burgers • Salads</span>
          <span class="price-range">₦3,000</span>
        </div>
      </div>
    </div>

    <!-- Categories -->
    <div class="categories">
      <button class="category-btn active">Burger</button>
      <button class="category-btn">Pizza</button>
      <button class="category-btn">Pasta</button>
      <button class="category-btn">Drinks</button>
    </div>

    <!-- Menu Items -->
    <div class="menu-container">

      <!-- Fish Burger -->
      <div class="menu-item">
        <img src="fish.svg" alt="Fish Burger">
        <div class="menu-details">
          <h3 class="menu-name">Fish Burger</h3>
          <p class="menu-desc">Fish</p>
          <div class="menu-bottom">
            <span class="price">₦1,500</span>
            <div class="quantity-control">
              <button class="qty-btn">-</button>
              <span class="qty-value">1</span>
              <button class="qty-btn">+</button>
            </div>
            <button class="add-btn">Add</button>
          </div>
        </div>
      </div>

      <!-- Cheese Burger -->
      <div class="menu-item">
        <img src="cheese.svg" alt="Cheese Burger">
        <div class="menu-details">
          <h3 class="menu-name">Cheese Burger</h3>
          <p class="menu-desc">Cheese</p>
          <div class="menu-bottom">
            <span class="price">₦2,500</span>
            <div class="quantity-control">
              <button class="qty-btn">-</button>
              <span class="qty-value">1</span>
              <button class="qty-btn">+</button>
            </div>
            <button class="add-btn">Add</button>
          </div>
        </div>
      </div>

      <!-- Veggie Burger -->
      <div class="menu-item">
        <img src="veggie.svg" alt="Veggie Burger">
        <div class="menu-details">
          <h3 class="menu-name">Veggie Burger</h3>
          <p class="menu-desc">Veggie</p>
          <div class="menu-bottom">
            <span class="price">₦3,500</span>
            <div class="quantity-control">
              <button class="qty-btn">-</button>
              <span class="qty-value">1</span>
              <button class="qty-btn">+</button>
            </div>
            <button class="add-btn">Add</button>
          </div>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
