<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodPlanner - Forget Password</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-container">
      <!-- LEFT IMAGE SECTION -->
      <div class="auth-left">
        <img src="images/food-image.png" alt="Food Image" class="auth-image" />
      </div>

      <!-- RIGHT FORM SECTION -->
      <div class="auth-right">
        <div class="auth-logo">
          <img src="images/logo.png" alt="FoodPlanner Logo" />
        </div>

        <div class="form-box">
          <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; color: #333">
            Forget Password?
          </h2>

          <div class="input-group">
            <div class="input-with-icon">
              <span><i class="far fa-user"></i></span>
              <input type="email" placeholder="Email Address" />
            </div>
          </div>

          <button
            class="auth-btn"
            onclick="window.location.href = 'password-changed.html'"
          >
            Proceed
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
