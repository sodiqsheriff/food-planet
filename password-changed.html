<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Changed</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <!-- LEFT SIDE -->
      <div class="auth-left">
        <img src="images/food.png" alt="Food Image" class="auth-image" />
      </div>

      <!-- RIGHT SIDE -->
      <div class="auth-right">
        <!-- LOGO -->
        <div class="auth-logo">
          <img src="images/logo.png" alt="Food Instat Logo" />
        </div>

        <!-- CARD -->
        <div class="auth-card">
          <div class="auth-icon">👍</div>
          <h2>Password Changed<br />Successfully</h2>
          <button
            class="auth-btn"
            onclick="window.location.href = 'index.html'"
          >
            Proceed to Login
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
